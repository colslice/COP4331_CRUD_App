<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact Manager Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body>

<div class="container">
    <div class="split">
        <div class="left-panel">
            <div class="form-card">

                <!-- LOGIN FORM -->
                <div id="loginSection">
                    <h1 class="form-title">Sign In</h1>

                    <form onsubmit="event.preventDefault(); doLogin();">
                        <div class="field">
                            <label>Username</label>
                            <input id="loginName" placeholder="eg. JohnDoe" />
                        </div>

                        <div class="field">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input
                                    id="loginPassword"
                                    type="password"
                                    placeholder="Enter your password"
                                />
                                <i class="fa-solid fa-eye-slash toggle-eye"
                                   onclick="togglePassword('loginPassword', this)"></i>
                            </div>
                        </div>

                        <p id="msgBox"></p>

                        <button type="submit">Sign In</button>
                    </form>

                    <p class="switch-login-text">
                        Don't have an account?
                        <a href="#" onclick="showRegister()">Sign up</a>
                    </p>
                </div>

                <!-- REGISTER FORM -->
                <div id="registerSection" style="display:none;">
                    <h1 class="form-title">Create Account</h1>

                    <form onsubmit="event.preventDefault(); doRegister();">
                        <div class="name-row">
                            <div class="field">
                                <label>First Name</label>
                                <input id="regFirst" placeholder="eg. John" required/>
                            </div>

                            <div class="field">
                                <label>Last Name</label>
                                <input id="regLast" placeholder="eg. Doe" required/>
                            </div>
                        </div>

                        <div class="field">
                            <label>Username</label>
                            <input id="regLogin" placeholder="eg. JohnDoe" required />
                        </div>

                        <div class="field">
                            <label>Password</label>
                            <div class="password-wrapper">
                                <input
                                    id="regPass"
                                    type="password"
                                    minlength="6"
                                    placeholder="Password"
                                    required
                                />
                                <i class="fa-solid fa-eye-slash toggle-eye"
                                   onclick="togglePassword('regPass', this)"></i>
                            </div>
                            <small class="pass-helper">Must be at least 6 characters</small>
                        </div>

                        <p id="msgBox"></p>

                        <button type="submit">Get Started</button>
                    </form>

                    <p class="switch-login-text">
                        Already have an account?
                        <a href="#" onclick="showLogin()">Log in</a>
                    </p>
                </div>

            </div>
        </div>
        <div class="right-panel"></div>
    </div>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>

<script>
    function showRegister() {
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("registerSection").style.display = "block";
        document.getElementById("msgBox").innerText = "";
    }

    function showLogin() {
        document.getElementById("loginSection").style.display = "block";
        document.getElementById("registerSection").style.display = "none";
        document.getElementById("msgBox").innerText = "";
    }

    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        }
    }
</script>

</body>
</html>
